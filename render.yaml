# Blueprint Render — CHEZ FATOUCHA  (https://render.com/docs/blueprint-spec)
#
# ✅ Fichier à la RACINE du dépôt, branche `main` : c'est là que Render cherche
#    `render.yaml` par défaut (sinon : « Blueprint file render.yaml not found »).
#
# ⚠️ Plan gratuit = disque temporaire : la base SQLite et les photos téléversées
#    repartent du seed à chaque redéploiement. Pour une vraie boutique : passer le
#    service en plan `starter` et dé-commenter le bloc `disk` (+ DATA_DIR/UPLOADS_DIR).
services:
  - type: web
    name: chez-fatoucha
    runtime: node
    plan: free
    region: frankfurt
    # L'application est à la racine du dépôt → aucun rootDir nécessaire.
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: node server/index.js
    healthCheckPath: /api/health
    # Node 20 = version testée, figée par le fichier .node-version à la racine
    # (Render le lit) : évite qu'une LTS plus récente casse le binaire natif de
    # better-sqlite3. package.json porte aussi engines.node en conséquence.
    envVars:
      # NB : ne PAS définir PORT — Render injecte le sien, le serveur le lit
      # automatiquement (process.env.PORT).
      - key: NODE_ENV
        value: production
      # Secret de session, généré par Render à la création du Blueprint.
      - key: JWT_SECRET
        generateValue: true
      # Compte vendeur créé au premier lancement (à changer !).
      - key: ADMIN1_USERNAME
        sync: false
      - key: ADMIN1_PASSWORD
        sync: false
      # auto = CinetPay si les clés sont présentes, sinon mode manuel Wave/Orange Money.
      - key: PAYEMENT_MODE
        value: auto
      # À renseigner après l'ouverture d'un compte marchand CinetPay :
      - key: CINETPAY_SITE_ID
        sync: false
      - key: CINETPAY_API_KEY
        sync: false
      # --- Réservé au plan payant (disque persistant) ---
      # - key: DATA_DIR
      #   value: /var/data/fatoucha
      # - key: UPLOADS_DIR
      #   value: /var/data/fatoucha/uploads
    # --- Réservé au plan payant : à dé-commenter avec plan: starter ---
    # disk:
    #   - name: fatoucha-data
    #     mountPath: /var/data/fatoucha
    #     sizeInGB: 1
